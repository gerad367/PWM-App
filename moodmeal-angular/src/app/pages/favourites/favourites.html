<div class="zona-superior-favoritos">
  <h1 id="title">Mis Favoritos</h1>

  <div class="acciones-favoritos">
    <select (change)="cambiarOrden($event)" class="select-orden">
      <option value="fecha">Añadidos recientemente</option>
      <option value="asc">Nombre (A-Z)</option>
      <option value="desc">Nombre (Z-A)</option>
    </select>

    <button (click)="vaciarFavoritos()" class="btn-vaciar">
      Vaciar lista
    </button>
  </div>
</div>

<div class="grid-restaurantes">
  @for (res of misFavoritosOrdenados(); track res.id) {
    <app-restaurant-card [restaurant]="res"></app-restaurant-card>
  } @empty {
    <div class="vacio">
      <p>No tienes favoritos guardados. 💔</p>
    </div>
  }
</div>
