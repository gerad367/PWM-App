<div class="contenedor-login">
  <section class="lado-derecho">
    <div class="form-container">
      <h2>Crear cuenta</h2>
      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

        <div class="grupo-input">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="ejemplo@correo.com">
          @if (registerForm.get('email')?.invalid && registerForm.get('email')?.touched) {
            <small class="error">Introduce un email válido</small>
          }
        </div>

        <div class="grupo-input">
          <label>Contraseña</label>
          <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
          @if (registerForm.get('password')?.invalid && registerForm.get('password')?.touched) {
            <small class="error">Mínimo 6 caracteres requeridos</small>
          }
        </div>

        <button type="submit" [disabled]="registerForm.invalid" class="boton-login">
          Registrarse
        </button>
      </form>

      <a routerLink="/login" class="link">¿Ya tienes cuenta? Entra aquí</a>
    </div>
  </section>
</div>
