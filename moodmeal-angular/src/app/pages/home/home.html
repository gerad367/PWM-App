<div class="seccion-entrada">
  <p class="pregunta-izquierda">¿Qué te <br> apetece hoy?</p>
  <img src="/assets/images/logo.png" alt="logo moodmeal">
</div>

<div class="Buscador">
  <input type="text" placeholder="Busca restaurantes, cocinas...">
  <button>
    <img src="/assets/images/icono3_search.svg" alt="Buscador">
  </button>
</div>

<div class="seccion-mood">
  <p class="pregunta-centro">¿Cómo te sientes?</p>
  <div class="contenedor-moods">

    <a [routerLink]="['/mood']" [queryParams]="{mood: 'romantico'}">
      <button class="boton-mood"><img src="/assets/images/emoji_romantico1.png" alt="Romántico"></button>
    </a>

    <a [routerLink]="['/mood']" [queryParams]="{mood: 'feliz'}">
      <button class="boton-mood"><img src="/assets/images/emoji_feliz1.png" alt="Feliz"></button>
    </a>

    <a [routerLink]="['/mood']" [queryParams]="{mood: 'energetico'}">
      <button class="boton-mood"><img src="/assets/images/emoji_energetico1.png" alt="Energético"></button>
    </a>

    <a [routerLink]="['/mood']" [queryParams]="{mood: 'triste'}">
      <button class="boton-mood"><img src="/assets/images/emoji_triste1.png" alt="Triste"></button>
    </a>

  </div>
</div>

<section class="contenedor-recomendaciones-restaurantes">

  <h2>Recomendados para ti</h2>

  <div class="grid-restaurantes">
    @for (res of restaurantes(); track res.id) {
      <app-restaurant-card [restaurant]="res"></app-restaurant-card>
    }@empty {
      <p>Cargando restaurantes o lista vacía...</p>
    }
  </div>

</section>
